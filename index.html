<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplicação de Vendas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 0;
      background-color: #f9f9f9;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #cccccc;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Enviar Pedido</h2>
    <form id="meuFormulario">
      <div class="form-group">
        <label for="nome">Nome do Cliente:</label>
        <input type="text" id="nome" name="nome" required>
      </div>

      <div class="form-group">
        <label for="respostaQuiz">Resposta do Quiz:</label>
        <input type="text" id="respostaQuiz" name="respostaQuiz" required>
      </div>

      <div class="form-group">
        <label for="pedido">Detalhes do Pedido:</label>
        <textarea id="pedido" name="pedido" rows="4" required></textarea>
      </div>

      <button type="submit" id="btnEnviar">Enviar Dados</button>
    </form>
  </div>

  <script>
    const FORMULARIO = document.getElementById('meuFormulario');
    const BOTAO_ENVIAR = document.getElementById('btnEnviar');
    
    // URL do Web App configurada
    const URL_APPS_SCRIPT = "https://script.google.com/macros/library/d/1vhn2qsiWdamPDHrt26u2vHG3pTUuO9J1rgCl3_GMfobDo3JqXuvoAJLb/31";

    FORMULARIO.addEventListener('submit', function(e) {
      e.preventDefault();

      BOTAO_ENVIAR.disabled = true;
      BOTAO_ENVIAR.innerText = "Enviando...";

      const dados = {
        nomeCliente: document.getElementById('nome').value,
        respostasQuiz: document.getElementById('respostaQuiz').value,
        itensPedido: document.getElementById('pedido').value
      };

      fetch(URL_APPS_SCRIPT, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(dados)
      })
      .then(function() {
        alert("Dados registrados com sucesso!");
        FORMULARIO.reset();
      })
      .catch(function(erro) {
        console.error("Erro na comunicação:", erro);
        alert("Erro ao enviar dados. Tente novamente.");
      })
      .finally(function() {
        BOTAO_ENVIAR.disabled = false;
        BOTAO_ENVIAR.innerText = "Enviar Dados";
      });
    });
  </script>

</body>
</html>
