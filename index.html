<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boticário 1975 Retro Quest</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameContainer {
      position: relative;
      border: 4px solid #fff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }
    canvas {
      background: #000;
      display: block;
      cursor: crosshair;
    }
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <div class="hud">
    <span id="stageTitle">STAGE 1: MARIO JUMP</span>
    <span id="scoreText">SCORE: 0000</span>
  </div>
  <canvas id="arcadeCanvas" width="600" height="450"></canvas>
</div>

<script>
const canvas = document.getElementById('arcadeCanvas');
const ctx = canvas.getContext('2d');
const stageTitle = document.getElementById('stageTitle');
const scoreText = document.getElementById('scoreText');

let mouseX = canvas.width / 2;
let mouseY = canvas.height / 2;
let currentStage = 1;
let score = 0;
let answers = {};

// Dados dos Jogadores / Física
let player = {
  x: 300,
  y: 380,
  vx: 0,
  vy: 0,
  radius: 12,
  isGrounded: true
};

let bullets = [];
let targets = [];

// Atualização de posição do Mouse
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
  mouseY = e.clientY - rect.top;
});

// Ação por Clique (Pulo / Disparo / Seleção)
canvas.addEventListener('mousedown', () => {
  if (currentStage === 1 && player.isGrounded) {
    // Pulo estilo Mario
    player.vy = -11;
    player.isGrounded = false;
  } else if (currentStage === 3) {
    // Disparo estilo River Raid
    bullets.push({ x: player.x, y: player.y - 15, vy: -8 });
  } else if (currentStage === 5) {
    // Tiro ao Alvo Direto
    checkTargetHit(mouseX, mouseY);
  }
});

function initStage(stageNum) {
  currentStage = stageNum;
  bullets = [];
  targets = [];
  
  if (stageNum === 1) {
    stageTitle.innerText = "FASE 1: PULE NO BLOCO (MARIO)";
    targets = [
      { id: 'Feminino', text: '[?] ELA', x: 100, y: 150, w: 100, h: 40 },
      { id: 'Masculino', text: '[?] ELE', x: 250, y: 150, w: 100, h: 40 },
      { id: 'Kids', text: '[?] KIDS', x: 400, y: 150, w: 100, h: 40 }
    ];
  } else if (stageNum === 2) {
    stageTitle.innerText = "FASE 2: CORRIDA E DESVIO (ENDURO)";
    targets = [
      { id: 'Perfumaria', text: '1: PERFUMARIA', x: 80, y: -50, w: 130, h: 35, vy: 2 },
      { id: 'Cremes', text: '2: CREMES', x: 235, y: -150, w: 130, h: 35, vy: 2 },
      { id: 'BodySplash', text: '3: SPLASH', x: 390, y: -250, w: 130, h: 35, vy: 2 }
    ];
  } else if (stageNum === 3) {
    stageTitle.innerText = "FASE 3: ATIRE NO OBJETIVO (RIVER RAID)";
    targets = [
      { id: 'Uso Pessoal', text: '=== USO PESSOAL ===', x: 100, y: 100, w: 180, h: 30, vx: 2 },
      { id: 'Presente', text: '=== PRESENTE ===', x: 320, y: 160, w: 180, h: 30, vx: -2 }
    ];
  } else if (stageNum === 4) {
    stageTitle.innerText = "FASE 4: CAPTURE O PERFIL (SNAKE)";
    targets = [
      { id: 'Marcante', text: 'O MARCANTE', x: 150, y: 120, r: 25 },
      { id: 'Suave', text: 'O SUAVE', x: 450, y: 120, r: 25 },
      { id: 'Fresco', text: 'O FRESCO', x: 300, y: 280, r: 25 }
    ];
  } else if (stageNum === 5) {
    stageTitle.innerText = "FASE 5: MIRE E ATIRE NA OCASIÃO";
    targets = [
      { id: 'Trabalho', text: '+ TRABALHO', x: 100, y: 150, vx: 3, vy: 2 },
      { id: 'Festa', text: '+ FESTA', x: 400, y: 200, vx: -2, vy: 3 },
      { id: 'Dia a Dia', text: '+ DIA A DIA', x: 200, y: 300, vx: 2, vy: -2 }
    ];
  }
}

function nextStage(choice) {
  score += 500;
  scoreText.innerText = `SCORE: ${String(score).padStart(4, '0')}`;
  if (currentStage < 5) {
    initStage(currentStage + 1);
  } else {
    currentStage = 6;
    stageTitle.innerText = "GAME OVER - VICTORY!";
  }
}

function checkTargetHit(x, y) {
  for (let t of targets) {
    if (x > t.x - 30 && x < t.x + 130 && y > t.y - 20 && y < t.y + 40) {
      nextStage(t.id);
      break;
    }
  }
}

// Loop Principal de Renderização e Física
function gameLoop() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Desenhar bordas de vetor em branco
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  ctx.strokeRect(5, 40, canvas.width - 10, canvas.height - 45);

  if (currentStage === 1) {
    // FASE 1: MARIO BROS (Pulo + Mouse X)
    player.x = mouseX;
    player.y += player.vy;
    player.vy += 0.5; // Gravidade

    if (player.y >= 380) {
      player.y = 380;
      player.vy = 0;
      player.isGrounded = true;
    }

    // Desenha Jogador
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.stroke();

    // Desenha Blocos [?]
    targets.forEach(t => {
      ctx.strokeRect(t.x, t.y, t.w, t.h);
      ctx.fillStyle = "#fff";
      ctx.font = "12px 'Courier New'";
      ctx.fillText(t.text, t.x + 15, t.y + 24);

      // Colisão por baixo (cabeçada no bloco)
      if (player.y - player.radius <= t.y + t.h && player.y - player.radius >= t.y &&
          player.x >= t.x && player.x <= t.x + t.w && player.vy < 0) {
        nextStage(t.id);
      }
    });

  } else if (currentStage === 2) {
    // FASE 2: ENDURO (Guiar com Mouse X)
    player.x = mouseX;
    player.y = 390;

    // Desenha Carro (Vetor Triângulo)
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - 15);
    ctx.lineTo(player.x - 15, player.y + 15);
    ctx.lineTo(player.x + 15, player.y + 15);
    ctx.closePath();
    ctx.stroke();

    // Movimentar e Desenhar Portas de Seleção
    targets.forEach(t => {
      t.y += t.vy;
      if (t.y > canvas.height) t.y = -40;

      ctx.strokeRect(t.x, t.y, t.w, t.h);
      ctx.fillStyle = "#fff";
      ctx.fillText(t.text, t.x + 10, t.y + 22);

      // Colisão Carro vs Bloco
      if (player.x > t.x && player.x < t.x + t.w && player.y - 15 < t.y + t.h && player.y + 15 > t.y) {
        nextStage(t.id);
      }
    });

  } else if (currentStage === 3) {
    // FASE 3: RIVER RAID (Nave + Tiros no Clique)
    player.x = mouseX;
    player.y = 400;

    // Nave
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - 15);
    ctx.lineTo(player.x - 12, player.y + 10);
    ctx.lineTo(player.x + 12, player.y + 10);
    ctx.closePath();
    ctx.stroke();

    // Atualiza Tiros
    bullets.forEach((b, index) => {
      b.y += b.vy;
      ctx.fillRect(b.x - 2, b.y, 4, 10);

      // Checa se tiro acertou alvos
      targets.forEach(t => {
        if (b.x > t.x && b.x < t.x + t.w && b.y > t.y && b.y < t.y + t.h) {
          bullets.splice(index, 1);
          nextStage(t.id);
        }
      });
    });

    // Mover Alvos no Rio
    targets.forEach(t => {
      t.x += t.vx;
      if (t.x <= 10 || t.x + t.w >= canvas.width - 10) t.vx *= -1;

      ctx.strokeRect(t.x, t.y, t.w, t.h);
      ctx.fillStyle = "#fff";
      ctx.fillText(t.text, t.x + 15, t.y + 20);
    });

  } else if (currentStage === 4) {
    // FASE 4: SNAKE (Seguir o Cursor do Mouse)
    player.x += (mouseX - player.x) * 0.1;
    player.y += (mouseY - player.y) * 0.1;

    // Desenha Cobrinha
    ctx.beginPath();
    ctx.arc(player.x, player.y, 8, 0, Math.PI * 2);
    ctx.stroke();

    targets.forEach(t => {
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.fillText(t.text, t.x - 30, t.y + 4);

      // Colisão por aproximação
      let dist = Math.hypot(player.x - t.x, player.y - t.y);
      if (dist < t.r + 8) {
        nextStage(t.id);
      }
    });

  } else if (currentStage === 5) {
    // FASE 5: TIRO AO ALVO (Mira no Mouse X/Y)
    targets.forEach(t => {
      t.x += t.vx;
      t.y += t.vy;

      if (t.x < 20 || t.x > canvas.width - 120) t.vx *= -1;
      if (t.y < 60 || t.y > canvas.height - 60) t.vy *= -1;

      ctx.strokeRect(t.x, t.y, 110, 35);
      ctx.fillStyle = "#fff";
      ctx.fillText(t.text, t.x + 10, t.y + 22);
    });

    // Desenhar Mira do Mouse (Crosshair Veto)
    ctx.strokeStyle = "#fff";
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 12, 0, Math.PI * 2);
    ctx.moveTo(mouseX - 18, mouseY); ctx.lineTo(mouseX + 18, mouseY);
    ctx.moveTo(mouseX, mouseY - 18); ctx.lineTo(mouseX, mouseY + 18);
    ctx.stroke();

  } else if (currentStage === 6) {
    // FIM DE JOGO
    ctx.fillStyle = "#fff";
    ctx.font = "16px 'Courier New'";
    ctx.fillText("PARABENS! CONSULTORIA CONCLUIDA", 140, 200);
    ctx.fillText("SEU BOTICARIO IDEAL FOI GERADO!", 140, 240);
    ctx.fillText("CLIQUE PARA REINICIAR", 190, 300);
  }

  requestAnimationFrame(gameLoop);
}

canvas.addEventListener('click', () => {
  if (currentStage === 6) initStage(1);
});

// Inicialização
initStage(1);
gameLoop();
</script>
</body>
</html>
