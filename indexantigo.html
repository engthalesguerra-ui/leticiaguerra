<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz O Boticário</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f7f4f2;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: #7a1c3d;
      font-size: 24px;
      margin-bottom: 6px;
    }
    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .quiz-section {
      margin-bottom: 20px;
    }
    .quiz-section h3 {
      font-size: 15px;
      color: #333;
      margin-bottom: 10px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      padding: 12px;
      border: 1px solid #7a1c3d;
      background-color: #7a1c3d;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    button:hover {
      background-color: #5a142d;
    }
    .card-result {
      margin-top: 30px;
      border: 1px solid #eedfd7;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background: #faf7f5;
    }
    .product-img {
      max-width: 100%;
      height: 200px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .img-fallback-fit {
      object-fit: cover;
    }
    .product-title {
      font-size: 18px;
      color: #2c3e50;
      margin: 10px 0 5px 0;
    }
    .product-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
      margin-bottom: 15px;
    }
    .btn-buy {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background-color: #25d366;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }
    .btn-buy:hover {
      background-color: #1ebd59;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>O Boticário</h1>
    <p class="subtitle">Escolha uma categoria para receber sua indicação perfeita:</p>

    <div class="quiz-section">
      <h3>Perfumaria</h3>
      <div class="btn-grid">
        <button onclick="finalizarQuiz('perfumaria', 'marcante')">Perfume Marcante</button>
        <button onclick="finalizarQuiz('perfumaria', 'refrescante')">Perfume Refrescante</button>
      </div>
    </div>

    <div class="quiz-section">
      <h3>Cuidados & Hidratação</h3>
      <div class="btn-grid">
        <button onclick="finalizarQuiz('cremes', 'suave')">Hidratante Corporal</button>
        <button onclick="finalizarQuiz('kidsbebe', 'suave')">Linha Infantil / Bebê</button>
      </div>
    </div>

    <div class="quiz-section">
      <h3>Cabelos & Barba</h3>
      <div class="btn-grid">
        <button onclick="finalizarQuiz('cabelos', 'refrescante')">Cabelos / Pomada</button>
        <button onclick="finalizarQuiz('barba', 'suave')">Cuidados para Barba</button>
      </div>
    </div>

    <div class="card-result">
      <h2 style="font-size: 15px; color: #7a1c3d; margin-top: 0;">Sua Recomendação Exclusiva</h2>
      
      <img id="res-product-img" class="product-img" src="assets/catalogo/placeholder-default.jpg" alt="Aguardando escolha" onerror="handleImageFallback(this)">
      
      <h3 id="res-product-name" class="product-title">Aguardando sua escolha...</h3>
      <p id="res-product-desc" class="product-desc">Clique em um dos botões acima para consultar o catálogo em tempo real.</p>
      
      <a id="res-product-link" href="#" class="btn-buy" target="_blank">Comprar / Ver Detalhes</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
